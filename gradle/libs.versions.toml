[versions]
agp = "9.4.1"
jackson = "2.18.2"
angusMail = "2.0.3"
jakartaMail = "2.1.3"
jsoup = "1.18.3"
slf4j = "2.0.16"
logback = "1.5.18"
junit = "5.11.4"
greenmail = "2.1.3"
javafx = "21.0.5"
javafxPlugin = "0.1.0"
androidMinSdk = "30"
androidCompileSdk = "35"
androidTargetSdk = "35"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jakarta-mail = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakartaMail" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angusMail" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafxPlugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
